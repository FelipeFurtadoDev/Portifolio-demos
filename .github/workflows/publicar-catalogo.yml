# =====================================================================
# Publica o catálogo e todas as demonstrações no GitHub Pages.
#
# A cada push na main:
#   1. copia o repositório para uma pasta de publicação temporária;
#   2. recupera prévias que faltem a partir do site já publicado;
#   3. gera as capturas (Playwright) só dos modelos que mudaram;
#   4. VERIFICA que todo modelo tem prévia válida; se faltar, a publicação
#      é interrompida e o site que está no ar continua como estava;
#   5. gera o index.html do catálogo e publica no GitHub Pages.
# Nada é commitado de volta no repositório: sem loops, sem conflitos.
#
# De onde vêm as prévias (da mais nova para a mais antiga):
#   captura nova > cache por conteúdo > catalogo/previas/ no repositório >
#   site publicado. As imagens da execução também ficam no artefato
#   "previas-catalogo" (90 dias), para baixar e versionar em catalogo/previas/.
#
# Requisito único (uma vez): Settings → Pages → Source = "GitHub Actions".
# Guia: catalogo/COMO-ADICIONAR-MODELOS.md
# =====================================================================
name: Publicar catálogo

on:
  push:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" na aba Actions
    inputs:
      permitir_sem_previa:
        description: "Publicar mesmo sem todas as prévias (só em emergência)"
        type: boolean
        default: false

# Por padrão, nenhum job pode escrever no repositório.
permissions:
  contents: read

# Uma publicação por vez; a que já começou termina antes da próxima.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar catálogo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Montar a pasta de publicação
        run: |
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          tar --exclude=./.git --exclude=./.github --exclude=./.gitignore \
              --exclude=./catalogo/build --exclude=./.previas-cache --exclude=./node_modules \
              -cf - . | tar -xf - -C "$SITE"
          echo "SITE=$SITE" >> "$GITHUB_ENV"

      # Capturas anteriores: só os modelos alterados são fotografados de novo.
      - name: Restaurar capturas anteriores
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .previas-cache
          key: previas-v1-${{ github.run_id }}
          restore-keys: previas-v1-

      # Fonte durável: o site que já está no ar. Só preenche o que falta e nunca
      # sobrescreve; a captura nova e o cache, mais abaixo, valem mais que isto.
      - name: Recuperar prévias do site publicado
        continue-on-error: true
        run: node catalogo/build/recuperar-previas.mjs --raiz "$SITE"

      # Falha de rede/apt aqui já causou a #9 (10 minutos e erro). Agora: tempo
      # limite por tentativa, 3 tentativas e, no fim, o Google Chrome que já vem
      # no runner. Mesmo que tudo falhe, o passo seguinte usa cache e prévias.
      - name: Instalar Playwright (Chromium)
        id: playwright
        continue-on-error: true
        working-directory: catalogo/build
        timeout-minutes: 15
        run: |
          set +e
          ok=0
          for t in 1 2 3; do
            timeout 120 npm install --no-audit --no-fund --no-package-lock && \
            timeout 240 npx playwright install --with-deps --only-shell chromium && { ok=1; break; }
            echo "::warning title=Playwright::tentativa $t de 3 falhou"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
            if [ -n "$CHROME" ] && [ -d node_modules/playwright ]; then
              echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
              echo "::warning title=Playwright::Chromium não instalou; usando $CHROME do runner"
              ok=1
            fi
          fi
          [ "$ok" = "1" ]

      - name: Gerar capturas dos modelos
        id: capturas
        continue-on-error: true
        run: node catalogo/build/capturar-previas.mjs --raiz "$SITE" --cache "$GITHUB_WORKSPACE/.previas-cache"

      - name: Guardar capturas para a próxima publicação
        if: always() && steps.capturas.outcome != 'skipped'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .previas-cache
          key: previas-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # Cópia durável das imagens desta execução, para baixar e versionar.
      - name: Guardar as prévias como artefato
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previas-catalogo
          path: ${{ runner.temp }}/site/catalogo/previas/*.webp
          if-no-files-found: warn
          retention-days: 90

      - name: Avisar se o navegador ou as capturas falharam
        if: always() && (steps.playwright.outcome == 'failure' || steps.capturas.outcome == 'failure')
        run: |
          echo "::warning title=Capturas::Playwright: ${{ steps.playwright.outcome }}; capturas: ${{ steps.capturas.outcome }}. Veja os logs; as prévias podem ser as da última publicação."
          {
            echo "### ⚠️ Etapa de capturas com falha"
            echo ""
            echo "Playwright: **${{ steps.playwright.outcome }}** · capturas: **${{ steps.capturas.outcome }}**."
            echo "A publicação só segue se todos os modelos tiverem prévia válida (próxima etapa)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Interrompe a publicação se algum modelo estiver sem prévia válida
      # (ou nenhum modelo for encontrado): o site no ar continua como estava.
      - name: Gerar o catálogo (index.html)
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.permitir_sem_previa }}" = "true" ]; then
            node catalogo/build/gerar-catalogo.mjs --raiz "$SITE" --exigir-previas --permitir-sem-previa
          else
            node catalogo/build/gerar-catalogo.mjs --raiz "$SITE" --exigir-previas
          fi

      - name: Enviar o site para o GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write    # publicar no GitHub Pages
      id-token: write # comprovar que a publicação vem deste workflow
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
